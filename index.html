<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Foto Animatie</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    .chaos-img {
      position: absolute;
      width: 100px;
      pointer-events: none;
      opacity: 0;
      transform: scale(0);
      transition: all 0.5s ease;
    }
  </style>
</head>
<body>

<script>
  const aantalFotos = 10000; // 👈 Hier kies je het aantal
  const afbeeldingen = ["foto1.jpg", "foto2.jpg", "foto3.jpg"]; // meerdere afbeeldingen

  function spawnFoto() {
    const img = document.createElement("img");
    img.src = afbeeldingen[Math.floor(Math.random() * afbeeldingen.length)];
    img.className = "chaos-img";

    img.style.top = Math.random() * window.innerHeight + "px";
    img.style.left = Math.random() * window.innerWidth + "px";

    document.body.appendChild(img);

    // Animatie: fade in + scale
    setTimeout(() => {
      img.style.opacity = 1;
      img.style.transform = `scale(1) rotate(${Math.random() * 360}deg)`;
    }, 50);
  }

  // Spawn alle foto's met een klein interval zodat het animatie-effect ontstaat
  for (let i = 0; i < aantalFotos; i++) {
    setTimeout(spawnFoto, i * 1); // elke 100ms een nieuwe foto
  }
</script>

</body>
</html>
