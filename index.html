<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mijn Simpele Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background: #2c7be5;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 14px;
      color: #777;
   }    
    button {
      margin-top: 15px;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #2c7be5;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #1a5fc4;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welkom</h1>
    <p>Dit is een snelle, simpele website</p>
  </header>

  <main>
    <div class="card">
      <h2>Over deze site</h2>
      <p>Deze website bestaat uit één HTML-bestand met ingebouwde CSS. Simpel, snel en direct te gebruiken.</p>
      <button onclick="alert('Assalamu alaikum!')">Klik mij</button>
    </div>
  </main>

  <footer>
    <p>© 2026 - Simpele Website</p>
  </footer>
</body>
</html>
