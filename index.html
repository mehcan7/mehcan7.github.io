<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Foto Chaos</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    .chaos-img {
      position: absolute;
      width: 150px;
      pointer-events: none;
    }
  </style>
</head>
<body>

<script>
  const aantalFotos = 30; // 👈 HIER bepaal je het aantal
  const afbeelding = "foto.jpg"; // jouw afbeelding

  for (let i = 0; i < aantalFotos; i++) {
    const img = document.createElement("img");
    img.src = afbeelding;
    img.className = "chaos-img";

    img.style.top = Math.random() * window.innerHeight + "px";
    img.style.left = Math.random() * window.innerWidth + "px";
    img.style.transform = `rotate(${Math.random() * 360}deg)`;

    document.body.appendChild(img);
  }
</script>

</body>
</html>
